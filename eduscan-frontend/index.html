<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScan AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; }
        label { font-weight: bold; margin-top: 15px; display: block; }
        input[type="file"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; margin-top: 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; display: none; }
        .loader { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h1>EduScan AI 📚</h1>
    <p style="text-align: center;">Transforme anotações em resumos com IA.</p>

    <div id="uploadForm">
        <label for="persona">Escolha a Persona:</label>
        <select id="persona" name="persona">
            <option value="tutor">Tutor (Didático e paciente)</option>
            <option value="professor">Professor (Acadêmico)</option>
            <option value="flashcards">Criador de Flashcards</option>
        </select>

        <label for="arquivo">Foto do Caderno:</label>
        <input type="file" id="arquivo" name="arquivo" accept="image/*" required>

        <button type="button" onclick="enviarForm()">Gerar Resumo</button>
    </div>

    <div class="loader" id="loader">Lendo imagem e gerando resumo com a AWS... Aguarde.</div>

    <div class="result-box" id="resultBox">
        <h3 id="materiaTexto" style="color: #1abc9c; margin-top: 0;"></h3>
        <p><strong>Conteúdo Lido:</strong> <span id="textoLido"></span></p>
        <p><strong>Resumo:</strong> <span id="resumoGerado"></span></p>
    </div>
</div>

<script>
    async function enviarForm() {
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        loader.style.display = 'block';
        resultBox.style.display = 'none';

        const fileInput = document.getElementById('arquivo');
        const personaInput = document.getElementById('persona').value;

        if (!fileInput.files[0]) {
            alert("Por favor, escolha a foto do caderno primeiro!");
            loader.style.display = 'none';
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]); 

        try {
            const response = await fetch(`http://127.0.0.1:8000/historico/upload?persona=${personaInput}`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('materiaTexto').innerText = `Matéria Detectada: ${data.materia_detectada}`;
                document.getElementById('textoLido').innerText = data.texto_extraido;
                document.getElementById('resumoGerado').innerText = data.resumo_gerado;
                resultBox.style.display = 'block';
            } else {
                alert('Erro na API: ' + JSON.stringify(data));
            }
        } catch (error) {
            alert('Erro de conexão. O servidor FastAPI está ligado?');
        } finally {
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
